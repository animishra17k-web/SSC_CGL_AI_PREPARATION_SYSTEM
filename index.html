<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.json"><title>SSC CGL AI OS</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e1e5ea;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #00000008}input,textarea,select,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #ccd2da;margin:4px 0}input,textarea,select{width:100%;background:white}button{cursor:pointer;background:#111827;color:white;border:0;padding:11px 15px}button.secondary{background:#e9edf2;color:#172033}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.stat{font-size:26px;font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef1f5;margin:2px}.topic{padding:10px;border-top:1px solid #eee}.topic b{display:block}.bar{height:8px;background:#e7eaf0;border-radius:9px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#111827}.danger{font-weight:650}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:10px 14px;border-radius:12px;display:none;z-index:10}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:12px}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>SSC CGL AI OS</h1><div class="muted">Source → knowledge → questions → errors → adaptive revision</div></div><button class="secondary" onclick="install()">Install on tablet</button></div>
<div class="grid"><section class="card"><div class="muted">Questions</div><div class="stat" id="qtotal">0</div></section><section class="card"><div class="muted">Flashcards</div><div class="stat" id="ftotal">0</div></section></div>
<section class="card"><h2>1. Add study material</h2><div class="grid"><form id="s"><input name="name" placeholder="Subject e.g. English" required><button>Add subject</button></form><form id="t"><select name="subject_id" id="ss"></select><input name="name" placeholder="Topic e.g. Subject-Verb Agreement" required><button>Add topic</button></form></div><form id="src"><select name="topic_id" id="tt"></select><input name="title" placeholder="Source title (Testbook / book / class notes)" required><textarea name="content" placeholder="Paste source text, or upload a PDF/DOCX/TXT below"></textarea><input type="file" name="file" accept=".pdf,.docx,.txt"><button>Add source</button></form></section>
<section class="card"><h2>2. Build the AI study pack</h2><div class="row"><select id="bt"></select><input id="n" type="number" min="10" max="100" value="40"><button onclick="build()">Build pack</button></div><p class="muted">This runs extraction → teaching notes → flashcards → questions → validation.</p><pre id="out"></pre></section>
<section class="card"><h2>3. Today’s adaptive queue</h2><div id="topics"></div><div class="row"><button class="secondary" onclick="loadDashboard()">Refresh</button><button onclick="loadReview()">Start flashcard review</button></div><div id="review"></div></section>
<section class="card"><h2>4. Weaknesses detected</h2><div id="weak"></div></section>
</div><div id="toast"></div><script>
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});async function install(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}else alert('Use your browser menu → Add to Home screen / Install app.')}
const $=id=>document.getElementById(id);function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
async function api(url,opt={}){let r=await fetch(url,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.detail||'Request failed');return j}
async function load(){let subs=await api('/api/subjects'),tops=await api('/api/topics');$('ss').innerHTML=subs.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');let opts=tops.map(x=>`<option value="${x.id}">${x.subject} — ${x.name}</option>`).join('');$('tt').innerHTML=opts;$('bt').innerHTML=opts;loadDashboard()}
$('s').onsubmit=async e=>{e.preventDefault();await api('/api/subjects',{method:'POST',body:new FormData(e.target)});e.target.reset();await load();toast('Subject added')}
$('t').onsubmit=async e=>{e.preventDefault();await api('/api/topics',{method:'POST',body:new FormData(e.target)});e.target.reset();await load();toast('Topic added')}
$('src').onsubmit=async e=>{e.preventDefault();$('out').textContent='Uploading source...';try{let j=await api('/api/sources',{method:'POST',body:new FormData(e.target)});$('out').textContent=JSON.stringify(j,null,2);toast('Source saved')}catch(x){$('out').textContent=x.message}}
async function build(){if(!$('bt').value){toast('Add a topic first');return}$('out').textContent='Running AI layers. Keep this tab open...';try{let j=await api(`/api/topics/${$('bt').value}/build?question_count=${$('n').value}`,{method:'POST'});$('out').textContent=JSON.stringify(j,null,2);loadDashboard();toast('Study pack built')}catch(x){$('out').textContent=x.message}}
async function loadDashboard(){try{let d=await api('/api/dashboard');$('qtotal').textContent=d.totals.questions;$('ftotal').textContent=d.totals.flashcards;$('topics').innerHTML=d.topics.length?d.topics.map(t=>`<div class="topic"><b>${t.subject} — ${t.name}</b><span class="pill">mastery ${Math.round(t.mastery||0)}%</span><span class="pill">priority ${Math.round(t.revision_priority||0)}</span><div class="bar"><i style="width:${Math.min(100,t.mastery||0)}%"></i></div></div>`).join(''):'<p class="muted">No topics yet.</p>';$('weak').innerHTML=d.weaknesses.length?d.weaknesses.map(w=>`<div class="topic"><b class="danger">${w.topic}: ${w.label}</b><span class="muted"> severity ${w.severity} · ${w.occurrences} occurrence(s)</span></div>`).join(''):'<p class="muted">No weaknesses recorded yet. Take a test after building questions.</p>'}catch(x){$('out').textContent=x.message}}
async function loadReview(){let rows=await api('/api/review/queue?limit=10');if(!rows.length){$('review').innerHTML='<p class="muted">Review queue is empty.</p>';return}let i=0;function show(){let x=rows[i];$('review').innerHTML=`<div class="card"><div class="muted">${i+1}/${rows.length} · ${x.topic}</div><h3>${x.front}</h3><details><summary>Show answer</summary><p>${x.back}</p></details><div class="row"><button onclick="rate('again')">Again</button><button onclick="rate('hard')">Hard</button><button onclick="rate('good')">Good</button><button onclick="rate('easy')">Easy</button></div></div>`}window.rate=async r=>{await api('/api/review/'+rows[i].id,{method:'POST',body:new URLSearchParams({rating:r})});i++;if(i>=rows.length){$('review').innerHTML='<p>Review session complete.</p>'}else show()};show()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');load();
</script></body></html>
